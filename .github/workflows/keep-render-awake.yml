name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Request backend health endpoint
        run: curl --fail --silent --show-error --max-time 30 https://luxrides-online.onrender.com/api/health